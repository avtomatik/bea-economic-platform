[project]
name = "bea-economic-platform"
version = "0.1.0"
description = "Reference architecture for a historical BEA economic data platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.3",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
bea-ingest = "bea.application.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bea"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
